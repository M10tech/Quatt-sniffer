binary_sensor:
## at least bits 0,2,4,5,6,11 are used for status in R2108
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Fan Low Speed Mode" #R2108b0
  register_type: holding
  address: 2108
  bitmask: 0x1
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Bottom Heater" #R2108b2
  register_type: holding
  address: 2108
  bitmask: 0x4
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Crankcase Heater" #R2108b3
  register_type: holding
  address: 2108
  bitmask: 0x8
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Fan Defrost Speed Mode" #R2108b4
  register_type: holding
  address: 2108
  bitmask: 0x10
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Fan High Speed Mode" #R2108b5
  register_type: holding
  address: 2108
  bitmask: 0x20
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - 4way Valve" #R2108b6
  register_type: holding
  address: 2108
  bitmask: 0x40
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Pump Relay" #R2108b11
  register_type: holding
  address: 2108
  bitmask: 0x800

- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Defrost Mode" #R2118b0
  icon: mdi:snowflake
  register_type: holding
  address: 2118

##Selection of register 2119 status bits put into binary sensors
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Alarm - Main Line Current" #R2119b0
  icon: mdi:message-alert
  register_type: holding
  address: 2119
  bitmask: 0x1
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Info - Compressor Oil Return" #R2119b3
  icon: mdi:message-alert
  register_type: holding
  address: 2119
  bitmask: 0x8
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Alarm - High Pressure Switch" #R2119b4
  icon: mdi:message-alert
  register_type: holding
  address: 2119
  bitmask: 0x10
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Alarm - 1st Start Pre-heat" #R2119b6
  icon: mdi:message-alert
  register_type: holding
  address: 2119
  bitmask: 0x40
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Alarm - AC High\Low Voltage" #R2119b9
  icon: mdi:message-alert
  register_type: holding
  address: 2119
  bitmask: 0x200
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Alarm - Low Pressure Switch" #R2119b12

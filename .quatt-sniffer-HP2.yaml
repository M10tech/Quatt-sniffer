modbus_controller:
- id: modbus_device_2
  address: 2               ## address of Quatt HP2 on the bus
  modbus_id: mod_bus

sensor: ## remember this setup MUST match the commands that a CIC sends to a Quatt
## these can be detected in verbose mode of modbus  and you can check the ranges that modbus_controller config reports
## first, there are 4 individual write commands
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Compressor Level set by CiC"
  register_type: holding
  address: 1999    ## address of the register inside the Quatt outdoor unit
  state_class: "measurement"
  filters:
    - multiply: 1
    - clamp:
        min_value: 0
        max_value: 10
        ignore_out_of_range: true

- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Silent Mode set by CiC"
  register_type: holding
  address: 2006

- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Pump Mode set by CiC"
  register_type: holding
  address: 2010

- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Pump Level set by CiC"
  register_type: holding
  address: 2015
  state_class: "measurement"
  accuracy_decimals: 2
  filters:
    - multiply: 0.01
    - clamp:
        min_value: 0
        max_value: 10
        ignore_out_of_range: true

- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Working Mode set by CiC"
  register_type: holding
  address: 3999

## read register blocks
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Working Mode Actual"
  register_type: holding
  address: 2099

- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Compressor AC Voltage"
  register_type: holding
  address: 2100
  unit_of_measurement: "V"
  device_class: "voltage"
  state_class: "measurement"
  accuracy_decimals: 1
  filters:
    - throttle: ${throttling_value}
    - multiply: 1
    - clamp:
        min_value: 0
        max_value: 300
        ignore_out_of_range: true

- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Compressor AC Current"
  register_type: holding
  address: 2101
  unit_of_measurement: "A"
  device_class: "current"
  state_class: "measurement"
  accuracy_decimals: 2
  filters:
    - throttle: ${throttling_value}
    - multiply: 0.1
    - clamp:
        min_value: 0
        max_value: 16
        ignore_out_of_range: true

- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Compressor Frequency Demand"
  register_type: holding
  address: 2102
  unit_of_measurement: "Hz"
  device_class: "frequency"
  state_class: "measurement"
  accuracy_decimals: 0
  filters:
    - throttle: ${throttling_value}
    - multiply: 1
    - clamp:
        min_value: 0
        max_value: 100
        ignore_out_of_range: true

- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Compressor Frequency Actual"
  register_type: holding
  address: 2103
  unit_of_measurement: "Hz"
  device_class: "frequency"
  state_class: "measurement"
  accuracy_decimals: 0
  filters:
    - throttle: ${throttling_value}
    - multiply: 1
    - clamp:
        min_value: 0
        max_value: 100
        ignore_out_of_range: true


- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Fan Speed Maximum"
  icon: mdi:fan
  register_type: holding
  address: 2104
  unit_of_measurement: "RPM"
  device_class: "speed"
  state_class: "measurement"
  accuracy_decimals: 0
  filters:
    - throttle: ${throttling_value}
    - multiply: 1
    - clamp:
        min_value: 0
        max_value: 1000
        ignore_out_of_range: true

- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Fan Speed Actual"
  icon: mdi:fan
  register_type: holding
  address: 2105
  unit_of_measurement: "RPM"
  device_class: "speed"
  state_class: "measurement"
  accuracy_decimals: 0
  filters:
    - throttle: ${throttling_value}
    - multiply: 1
    - clamp:
        min_value: 0
        max_value: 1000
        ignore_out_of_range: true

- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Electric Expansion Valve"
  register_type: holding
  address: 2107
  unit_of_measurement: "p"
  state_class: "measurement"
  accuracy_decimals: 0
  filters:
    - throttle: ${throttling_value}
    - multiply: 1
    - clamp:
        min_value: 0
        max_value: 1000
        ignore_out_of_range: true

## Some of the register 2108 status bits placed into binary sensors in the next section
- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Other bits R2108"
  register_type: holding
  address: 2108
  bitmask: 0xf782   ## all the remaining bits
  filters:
    - multiply: 2   ## due to bitmask doing mask_and_shift_by_rightbit our mask divides by 2 which we undo

## we could not remove this register since this would mess up the previous bitmask register, so internal=true

- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Outside Temperature"
  register_type: holding
  address: 2110
  unit_of_measurement: "°C"
  device_class: "temperature"
  state_class: "measurement"
  accuracy_decimals: 2
  filters:
    - throttle: ${throttling_value}
    - offset: -3000
    - multiply: 0.01
    - clamp:
        min_value: -30
        max_value: 100
        ignore_out_of_range: true

- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Evaporator Coil Temperature"
  register_type: holding
  address: 2111
  unit_of_measurement: "°C"
  device_class: "temperature"
  state_class: "measurement"
  accuracy_decimals: 2
  filters:
    - throttle: ${throttling_value}
    - offset: -3000
    - multiply: 0.01
    - clamp:
        min_value: -30
        max_value: 100
        ignore_out_of_range: true

- platform: modbus_controller
  modbus_controller_id: modbus_device_2
  name: "HP2 - Gas Discharge Temperature"
  register_type: holding
  address: 2112
  unit_of_measurement: "°C"
  device_class: "temperature"
  state_class: "measurement"
  accuracy_decimals: 2
  filters:
    - throttle: ${throttling_value}
    - offset: -3000
    - multiply: 0.01
    - clamp:
        min_value: -30
        max_value: 150
        ignore_out_of_range: true

